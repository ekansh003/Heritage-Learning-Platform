    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What age groups are Exploristory programs designed for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Programs are customized for students from primary school through higher secondary levels, with activities adapted to age and curriculum requirements."
            }
          },

            "@type": "Question",
            "name": "Can expeditions be customized for our school curriculum?",

          },

            "acceptedAnswer": {
              "@type": "Answer",

          },

            "@type": "Question",
            "name": "How can schools book a program?",

            }
